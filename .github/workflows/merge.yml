name: Merge IPTV Playlists from URLs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          # Buat file baru dengan header M3U
          echo "#EXTM3U" > merged.m3u

          URLS=(
            "https://gitlab.com/ridjals739/ppv-playlist/-/raw/main/myplaylist.m3u"
            "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/primevideo_sports.m3u"
            "https://raw.githubusercontent.com/srhady/axsports/refs/heads/main/playlist.m3u"
            "https://colloriptvpro.biz.id/micin"
          )

          for url in "${URLS[@]}"; do
            echo "🔹 Merging $url ..."
            
            # Tambahkan query string acak (?v=timestamp) & header no-cache agar tidak kena cache CDN
            CACHE_BUSTER="$(date +%s)"
            CONTENT=$(curl -sfL -H "Cache-Control: no-cache, no-store, must-revalidate" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$url?v=$CACHE_BUSTER" | tr -d '\r')

            if [ -n "$CONTENT" ]; then
              # Hapus header #EXTM3U dari playlist sumber
              echo "$CONTENT" | sed '/^#EXTM3U/d' >> merged.m3u
              echo "" >> merged.m3u
              echo "✅ Successfully merged $url"
            else
              echo "❌ Failed to load or empty response from $url"
            fi
          done

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "✅ Merge complete at $TIMESTAMP"

      - name: Commit and push merged file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add merged.m3u
          
          # Cek jika ada perubahan pada file merged.m3u
          if git diff --staged --quiet; then
            echo "⚠️ Tidak ada perubahan data playlist terdeteksi dari sumber."
          else
            git commit -m "Auto merge playlists [$(date -u +'%Y-%m-%dT%H:%M:%SZ')]"
            git push origin HEAD:${{ github.ref_name }}
          fi
          
