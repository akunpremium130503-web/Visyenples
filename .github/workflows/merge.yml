name: Merge IPTV Playlists from URLs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/17 * * * *" #

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          # Buat header M3U utama
          echo "#EXTM3U" > merged.m3u

          for url in \
            "https://gitlab.com/ridjals739/ppv-playlist/-/raw/main/myplaylist.m3u" \
            "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/primevideo_sports.m3u" \
            "https://raw.githubusercontent.com/srhady/axsports/refs/heads/main/playlist.m3u" \
            "https://colloriptvpro.biz.id/micin"
          do
            echo "🔹 Merging $url ..."
            if curl -sf "$url" | tail -n +2 >> merged.m3u; then
              echo "" >> merged.m3u
              echo "# ✅ Successfully merged $url" >> merged.m3u
            else
              echo "# ❌ Failed to load $url" >> merged.m3u
            fi
          done

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          UUID=$(cat /proc/sys/kernel/random/uuid)
          
          echo "" >> merged.m3u
          echo "# Auto-updated at $TIMESTAMP (ID: $UUID)" >> merged.m3u
          echo "✅ Merge complete at $TIMESTAMP"

      - name: Commit and push merged file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add merged.m3u
          
          # Hanya commit & push jika ada perubahan pada file
          if git commit -m "Auto merge playlists [$(date -u +'%Y-%m-%dT%H:%M:%SZ')]"; then
            git pull origin main --rebase
            git push origin main
          else
            echo "Tidak ada perubahan data playlist."
          fi
