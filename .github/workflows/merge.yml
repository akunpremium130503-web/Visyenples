name: Merge IPTV Playlists from URLs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          # Buat file baru dengan header M3U standar
          echo "#EXTM3U" > merged.m3u

          for url in \
            "https://gitlab.com/ridjals739/ppv-playlist/-/raw/main/myplaylist.m3u" \
            "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/primevideo_sports.m3u" \
            "https://raw.githubusercontent.com/srhady/axsports/refs/heads/main/playlist.m3u" \
            "https://colloriptvpro.biz.id/micin"
          do
            echo "🔹 Merging $url ..."
            
            # Unduh konten dengan User-Agent browser & follow redirect (-L)
            CONTENT=$(curl -sfL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "$url")

            if [ -n "$CONTENT" ]; then
              # Hapus header #EXTM3U dari playlist sumber agar tidak terduplikasi
              echo "$CONTENT" | sed '/^#EXTM3U/d' >> merged.m3u
              echo "" >> merged.m3u
              echo "✅ Successfully merged $url"
            else
              echo "❌ Failed to load $url"
            fi
          done

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "✅ Merge complete at $TIMESTAMP"

      - name: Commit and push merged file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add merged.m3u
          
          # Hanya commit & push jika file merged.m3u mengalami perubahan
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data playlist."
          else
            git commit -m "Auto merge playlists [$(date -u +'%Y-%m-%dT%H:%M:%SZ')]"
            git pull origin main --rebase
            git push origin main
          fi
          
